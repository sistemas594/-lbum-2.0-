<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.app{padding:1rem 0}
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:1rem}
.header-title{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.header-sub{font-size:13px;color:var(--color-text-secondary);margin-top:2px}
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;text-align:center}
.stat-num{font-size:20px;font-weight:500;color:var(--color-text-primary)}
.stat-lbl{font-size:11px;color:var(--color-text-secondary);margin-top:2px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.controls input[type=text]{flex:1;min-width:160px;height:34px;padding:0 10px;font-size:13px}
.tab-bar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:1rem}
.tab{padding:5px 12px;border-radius:var(--border-radius-md);font-size:12px;cursor:pointer;border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);color:var(--color-text-secondary)}
.tab.active{background:var(--color-background-secondary);color:var(--color-text-primary);font-weight:500}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.team-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer;transition:border-color 0.15s}
.team-card:hover{border-color:var(--color-border-secondary)}
.team-card.done{border-color:#1D9E75;border-width:1.5px}
.team-head{padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.team-name{font-size:13px;font-weight:500;color:var(--color-text-primary)}
.team-flag{font-size:20px}
.team-prog{padding:0 12px 10px}
.prog-bar{height:5px;background:var(--color-border-tertiary);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:#1D9E75;border-radius:3px;transition:width 0.2s}
.prog-lbl{font-size:11px;color:var(--color-text-secondary);margin-top:4px}
.detail-view{display:none}
.detail-view.open{display:block}
.team-view{display:block}
.team-view.hidden{display:none}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;border:none;background:none;padding:0;margin-bottom:12px}
.back-btn:hover{color:var(--color-text-primary)}
.detail-header{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.detail-flag{font-size:36px}
.detail-title{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.detail-sub{font-size:13px;color:var(--color-text-secondary)}
.stickers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.sticker{border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:8px 6px;text-align:center;cursor:pointer;user-select:none;transition:background 0.1s,border-color 0.1s;position:relative}
.sticker:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}
.sticker.have{background:#EAF3DE;border-color:#639922}
.sticker.repeated{background:#FAEEDA;border-color:#BA7517}
.sticker-code{font-size:10px;font-weight:500;color:var(--color-text-secondary);margin-bottom:3px}
.sticker-name{font-size:10px;color:var(--color-text-primary);line-height:1.3}
.sticker.have .sticker-code,.sticker.have .sticker-name{color:#3B6D11}
.sticker.repeated .sticker-code,.sticker.repeated .sticker-name{color:#854F0B}
.sticker-icon{font-size:16px;margin-bottom:2px}
.sticker.foil .sticker-code::after{content:"✦";font-size:8px;color:#BA7517;margin-left:2px}
.rep-badge{position:absolute;top:3px;right:3px;background:#BA7517;color:#fff;font-size:9px;font-weight:500;border-radius:3px;padding:1px 3px;min-width:14px;text-align:center}
.sticker-actions{display:flex;gap:4px;margin-top:4px;justify-content:center}
.s-btn{font-size:10px;border:0.5px solid var(--color-border-tertiary);background:none;border-radius:3px;padding:1px 5px;cursor:pointer;color:var(--color-text-secondary)}
.s-btn:hover{background:var(--color-background-secondary)}
.group-lbl{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin:1rem 0 6px;display:flex;align-items:center;gap:6px}
.section-stickers{margin-bottom:1.5rem}
.special-section{margin-bottom:1.5rem}
</style>

let state = {};
let currentTeam = null;
let currentView = 'all';

function loadState(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=JSON.parse(s);}catch(e){}
}
function saveState(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}
}
function getKey(code,n){return code+'_'+n;}
function getSticker(code,n){return state[getKey(code,n)]||0;}
function totalStickers(){
  let have=0,rep=0;
  Object.values(state).forEach(v=>{if(v===1)have++;else if(v>=2)rep+=v-1;});
  return{have,rep};
}
function totalNeeded(){return TEAMS.reduce((a,t)=>a+t.stickers.length,0);}
function teamProgress(t){
  const total=t.stickers.length;
  const have=t.stickers.filter(s=>getSticker(t.code,s.n)>=1).length;
  return{have,total};
}

function clickSticker(code,n,el){
  const cur=getSticker(code,n);
  const next=cur>=2?0:cur+1;
  state[getKey(code,n)]=next;
  saveState();
  el.className='sticker'+(next>=1?' have':'')+(next>=2?' repeated':'');
  if(el.querySelector('.sticker-code')&&el.dataset.foil==='true'){
    el.querySelector('.sticker-code').className='sticker-code';
  }
  const badge=el.querySelector('.rep-badge');
  if(next>=2){
    if(!badge){const b=document.createElement('span');b.className='rep-badge';b.textContent=next-1;el.appendChild(b);}
    else badge.textContent=next-1;
  } else if(badge) badge.remove();
  updateStats();
  refreshTeamCard(code);
}

function updateStats(){
  const{have,rep}=totalStickers();
  const total=totalNeeded();
  const pct=Math.round(have/total*100);
  document.getElementById('stats-bar').innerHTML=`
    <div class="stat"><div class="stat-num">${have}</div><div class="stat-lbl">Tengo</div></div>
    <div class="stat"><div class="stat-num">${total-have}</div><div class="stat-lbl">Faltan</div></div>
    <div class="stat"><div class="stat-num">${rep}</div><div class="stat-lbl">Repetidas</div></div>
    <div class="stat"><div class="stat-num">${pct}%</div><div class="stat-lbl">Completado</div></div>
  `;
}

function refreshTeamCard(code){
  const el=document.querySelector(`[data-code="${code}"]`);
  if(!el)return;
  const t=TEAMS.find(x=>x.code===code);
  const{have,total}=teamProgress(t);
  const pct=Math.round(have/total*100);
  el.querySelector('.prog-fill').style.width=pct+'%';
  el.querySelector('.prog-lbl').textContent=`${have}/${total} láminas`;
  if(have===total)el.classList.add('done');else el.classList.remove('done');
}

function buildTeamCard(t){
  const{have,total}=teamProgress(t);
  const pct=Math.round(have/total*100);
  const div=document.createElement('div');
  div.className='team-card'+(have===total?' done':'');
  div.dataset.code=t.code;
  div.dataset.name=t.name.toLowerCase();
  div.innerHTML=`<div class="team-head"><div class="team-flag">${t.flag}</div><div class="team-name">${t.name}</div></div>
  <div class="team-prog"><div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
  <div class="prog-lbl">${have}/${total} láminas</div></div>`;
  div.onclick=()=>openDetail(t.code);
  return div;
}

function renderTeams(filter='all'){
  const grid=document.getElementById('team-grid');
  grid.innerHTML='';
  const q=(document.getElementById('search').value||'').toLowerCase();
  TEAMS.forEach(t=>{
    if(t.special&&filter!=='special'&&filter!=='all')return;
    if(filter==='complete'){const{have,total}=teamProgress(t);if(have<total)return;}
    if(filter==='missing'){const{have,total}=teamProgress(t);if(have===total)return;}
    if(filter==='special'&&!t.special)return;
    if(q&&!t.name.toLowerCase().includes(q)&&!t.stickers.some(s=>s.name.toLowerCase().includes(q)))return;
    grid.appendChild(buildTeamCard(t));
  });
}

function openDetail(code){
  const t=TEAMS.find(x=>x.code===code);
  currentTeam=code;
  document.getElementById('team-view').classList.add('hidden');
  document.getElementById('detail-view').classList.add('open');
  document.getElementById('d-flag').textContent=t.flag;
  document.getElementById('d-name').textContent=t.name;
  const{have,total}=teamProgress(t);
  document.getElementById('d-sub').textContent=`${have}/${total} láminas · ${t.group&&t.group!=='special'?'Grupo '+t.group:'Sección especial'}`;
  const cont=document.getElementById('d-stickers');
  cont.innerHTML='';
  const grid=document.createElement('div');grid.className='stickers-grid';
  t.stickers.forEach(s=>{
    const val=getSticker(t.code,s.n);
    const el=document.createElement('div');
    el.className='sticker'+(s.foil?' foil':'')+(val>=1?' have':'')+(val>=2?' repeated':'');
    el.dataset.foil=s.foil?'true':'false';
    el.innerHTML=`<div class="sticker-code">${s.n}</div><div class="sticker-name">${s.name}</div>`;
    if(val>=2){const b=document.createElement('span');b.className='rep-badge';b.textContent=val-1;el.appendChild(b);}
    el.onclick=()=>clickSticker(t.code,s.n,el);
    grid.appendChild(el);
  });
  cont.appendChild(grid);
  const hint=document.createElement('p');
  hint.style.cssText='font-size:12px;color:var(--color-text-secondary);margin-top:12px';
  hint.textContent='1 clic = tengo · 2 clics = repetida · 3 clics = quitar';
  cont.appendChild(hint);
}

function closeDetail(){
  document.getElementById('team-view').classList.remove('hidden');
  document.getElementById('detail-view').classList.remove('open');
  currentTeam=null;
  renderTeams(currentView);
}

function setView(v,el){
  currentView=v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTeams(v);
}

function filterTeams(){renderTeams(currentView);}

function resetAll(){
  if(confirm('¿Reiniciar todo el progreso?')){state={};saveState();updateStats();if(currentTeam)openDetail(currentTeam);else renderTeams(currentView);}}

loadState();
updateStats();
renderTeams('all');
</script>
